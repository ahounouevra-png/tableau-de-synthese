}

.sheet { --sec: var(--sec-formation); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }

/* Présentation sobre, proche d'un document professionnel plutôt que d'un site vitrine */
:root {
  color-scheme: light;
  --bg: #f1f2f3;
  --surface: #ffffff;
  --ink: #252b30;
  --muted: #626b73;
  --line: #d7dce0;
  --brand: #344f68;
  --brand-ink: #ffffff;
  --brand-soft: #e9eef2;
  /* Une couleur distincte par compétence, reprise dans la légende et le tableau */
  --c1: #2878b8; /* Patrimoine : bleu */
  --c2: #c45b42; /* Incidents : terracotta */
  --c3: #8056a8; /* Présence en ligne : violet */
  --c4: #b17a19; /* Projet : ocre */
  --c5: #32845b; /* Service : vert */
  --c6: #b44768; /* Développement professionnel : rose */
  --sec-formation: #405d72;
  --sec-stage: #80694f;
  --sec-seconde: #66717a;
  --shadow: none;
  --font-display: Arial, Helvetica, sans-serif;
  --font-body: Arial, Helvetica, sans-serif;
}
body { background: var(--bg); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
h1, h2, h3, h4, .ccard button.pick, .banner { font-family: Arial, Helvetica, sans-serif; letter-spacing: normal; }
.wrap { max-width: 1240px; gap: 20px; }
.identity, .ccard, .sheet { border-radius: 4px; box-shadow: none; }
.identity { border: 1px solid var(--line); }
.ccard { border-radius: 4px; border-top: 3px solid var(--cc); background: color-mix(in srgb, var(--cc) 6%, #ffffff); }
.ccard button.pick { border-radius: 3px; }
.ccard .swatch { background: var(--cc); color: #fff; }
.ccard .count { color: var(--cc); background: color-mix(in srgb, var(--cc) 14%, #fff); }
.ccard[data-on="true"] { background: color-mix(in srgb, var(--cc) 13%, #fff); border-color: var(--cc); }
.band { border-radius: 3px 3px 0 0; }
.btn-pdf, .proof { border-radius: 4px; box-shadow: none; }
.btn-pdf { background: #286c9c; color: #fff; border: 1px solid #20577f; font-weight: 700; }
.btn-pdf:hover { background: #20577f; color: #fff; }
.row:hover { background: #f7f8f9; }
.ccard[data-on="true"] { background: #f2f5f7; }
.ccard .swatch { border-radius: 3px; }
.ccard .count, .band .n, .opt, .pill { border-radius: 3px; }
.toast { border-radius: 4px; }
.cell-link { border-radius: 3px; }

  :root:not([data-theme="light"]) { color-scheme: light; }
}

function h(tag, attrs, kids) {
  const el = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  (kids || []).forEach(c => c && el.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
  return el;
}

function proofsFor(row, competenceIndex) {
  const raw = row.preuves && row.preuves[String(competenceIndex)] || [];
  return (Array.isArray(raw) ? raw : [raw])
    .filter(Boolean)
    .map(p => ({ label: p.label || "Consulter la preuve", url: safeUrl(p.url) }))
    .filter(p => p.url);
}

function relationCell(row, competence, competenceIndex) {
  const on = row.c.includes(competenceIndex);
  const cell = h("div", {
    class: "cell" + (on ? " on" : ""),
    style: cc(competenceIndex),
    role: on ? "group" : "img",
    "aria-label": competence.nom + (on ? " : mise en œuvre" : " : non concernée")
  });

  if (on) {
    const proofs = proofsFor(row, competenceIndex);
    if (proofs.length === 1) {
      cell.appendChild(h("a", {
        class: "cell-link", href: proofs[0].url, target: "_blank", rel: "noopener noreferrer",
        title: "Preuve pour « " + competence.nom + " » : " + proofs[0].label,
        "aria-label": "Ouvrir la preuve : " + proofs[0].label
      }, ["↗"]));
    } else if (proofs.length > 1) {
      const btn = h("button", {
        type: "button", class: "cell-link", "aria-expanded": "false",
        "aria-label": proofs.length + " preuves pour " + competence.nom,
        title: proofs.length + " preuves pour cette compétence"
      }, [String(proofs.length)]);
      const menu = h("div", { class: "menu", hidden: true },
        proofs.map(p => h("a", { href: p.url, target: "_blank", rel: "noopener noreferrer", text: p.label })));
      btn.addEventListener("click", e => {
        e.stopPropagation();
        const wasOpen = openMenu === menu;
        closeMenu();
        if (!wasOpen) { menu.hidden = false; btn.setAttribute("aria-expanded", "true"); openMenu = menu; }
      });
      cell.appendChild(btn);
      cell.appendChild(menu);
    } else {
      const missing = h("button", {
        type: "button", class: "cell-link missing",
        title: "Lien de preuve à ajouter pour « " + competence.nom + " »",
        "aria-label": "Lien de preuve à ajouter pour " + competence.nom
      }, ["＋"]);
      missing.addEventListener("click", () => toast("Ajoute une URL dans preuves[\"" + competenceIndex + "\"] pour cette réalisation."));
      cell.appendChild(missing);
    }
  }
  return cell;
}

function proofControl(row) {
  const all = [];
  row.c.forEach(i => proofsFor(row, i).forEach(p => {
    all.push({ label: DATA.competences[i - 1].court + " — " + p.label, url: p.url });
  }));
  const box = h("div", { class: "r-proof" });
  if (all.length === 0) {

    a.addEventListener("click", () => toast("Ajoute un lien dans preuves[\"numéro_compétence\"] pour chaque relation."));
    box.appendChild(a);
  } else if (all.length === 1) {
    box.appendChild(h("a", { class: "proof", href: all[0].url, target: "_blank", rel: "noopener noreferrer", title: all[0].label }, [icon(), "Voir la preuve"]));
  } else {
    const btn = h("button", { type: "button", class: "proof", "aria-expanded": "false", "aria-haspopup": "true" }, [icon(), "Preuves (" + all.length + ")"]);

function applyFilter() {

      vis += v;

}
